[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spacedrift-api"
version = "0.1.0"
description = "FastAPI service for version-specific client approvals"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.143.2",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "pyjwt[crypto]==2.15.1",
  "sqlalchemy==2.1.4",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["spacedrift_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
